<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasuka Mahjong - Pro Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-dark: #0c1b2b;
            --gold: #00d4ff;
            --gold-bright: #e0f7ff;
            --red-panel: #1e5b8b;
            --tile-white: #f9f9f9;
            --tile-shadow: #b3c7d6;
            --overlay: rgba(0,0,0,1);
        }

        body {
            margin: 0; padding: 0; background-color: #000;
            font-family: 'Arial', sans-serif; display: flex;
            justify-content: center; align-items: center;
            height: 100vh; color: white; overflow: hidden;
        }

        #game-view {
            width: 100%; height: 100vh; max-width: 450px;
            background-image: url('https://nasukafoods.site/image/qris.jpg'); 
            background-size: cover; background-position: center;
            background-repeat: no-repeat; background-color: black; 
            display: flex; flex-direction: column; position: relative; box-sizing: border-box;
        }

        .top-nav {
            display: flex; justify-content: space-between; padding: 15px 20px;
            font-size: 0.75rem; background: rgba(0, 0, 0, 0.6); position: relative; z-index: 1000;
        }

        .nav-link { color: var(--gold); text-decoration: underline; cursor: pointer; }

        #multiplier-bar {
            background: transparent; display: flex; justify-content: space-around; 
            align-items: center; padding: 0 10px; height: 50px; 
            position: relative; z-index: 500; margin-bottom: -40px; pointer-events: none;
        }

        .mult {
            width: 50px; height: auto; opacity: 0.3; filter: grayscale(100%);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; pointer-events: auto;
        }

        #m1 { transform: translateY(20px) rotate(-15deg); } 
        #m2 { transform: translateY(-5px) rotate(-5deg); }  
        #m3 { transform: translateY(-5px) rotate(5deg); }   
        #m5 { transform: translateY(20px) rotate(15deg); }  

        .mult.active {
            opacity: 1; filter: grayscale(0%) drop-shadow(0 0 10px var(--gold));
            z-index: 100; transform: scale(1.4);
        }

        #grid-container {
            display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr);
            gap: 6px; padding: 12px; margin: 10px auto; width: 92%; aspect-ratio: 1 / 1;
            background-image: url('https://nasukafoods.site/image/ombak.gif');
            background-size: cover; background-position: center; background-color: #000; 
            z-index: 1; position: relative; box-sizing: border-box;
        }

        #win-announcement {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%) scale(0); 
            z-index: 2000; text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.3s ease;
        }

        #win-announcement.show-win {
            opacity: 1; transform: translate(-50%, -50%) scale(1);
            animation: pulse-bigwin 0.8s infinite ease-in-out;
        }

        @keyframes pulse-bigwin {
            0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(0 0 10px var(--gold)); }
            50% { transform: translate(-50%, -50%) scale(1.15); filter: drop-shadow(0 0 30px var(--gold-bright)); }
        }

        .tile {
            background: var(--tile-white); border-radius: 6px; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 -5px 0 var(--tile-shadow), 0 4px 6px rgba(0,0,0,0.3);
            position: relative; overflow: hidden;
        }

        .tile img { width: 85%; height: 85%; object-fit: contain; pointer-events: none; }

        #ui-panel {
            background: rgba(0, 0, 0, 0.8); padding: 10px; border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative; z-index: 900; width: 100%; box-sizing: border-box;
        }

        .stats-main { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
        .stat-card { background: rgba(0,0,0,0.5); flex: 1; padding: 6px; border-radius: 4px; text-align: center; border: 1px solid #444; }
        .label { font-size: 0.65rem; color: var(--gold); display: block; text-transform: uppercase; }
        .value { font-size: 0.9rem; font-weight: bold; }

        .bet-controls { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 15px; }
        .bet-btn { background: #444; color: white; border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }

        .spin-area { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #spin-btn { width: 80px; height: 80px; background: radial-gradient(circle, #4caf50, #1b5e20); border: 4px solid #fff; border-radius: 50%; font-size: 2.2rem; cursor: pointer; color:white; }
        .auto-btn { background: #333; color: #fff; border: 1px solid #666; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; }
        .auto-btn.active { border-color: #ff4444; color: #ff4444; }

        .spa-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-dark);
            z-index: 1000; display: none; flex-direction: column; padding: 20px; box-sizing: border-box; overflow-y: auto;
        }

        .card { background: var(--red-panel); padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; font-weight: bold; color: #000; }
        .btn-gold { background: var(--gold); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 6px; width: 100%; cursor: pointer; text-align: center; display: block; text-decoration: none; margin-top: 5px; }

        #nasuka-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
            z-index: 9999; display: none; justify-content: center; align-items: center;
        }
        .nasuka-modal { width: 85%; max-width: 320px; background: #1e2a38; border: 2px solid var(--gold); border-radius: 12px; padding: 20px; text-align: center; }
    </style>
</head>
<body>

<div id="nasuka-modal-overlay">
    <div class="nasuka-modal">
        <h4 id="modal-title" style="color:var(--gold); margin:0 0 10px 0;">INFO</h4>
        <p id="modal-msg" style="font-size:0.9rem;"></p>
        <div id="modal-btns" style="display:flex; gap:10px; justify-content:center;"></div>
    </div>
</div>

<div id="game-view">
    <div class="top-nav">
        <span class="nav-link" onclick="showPage('page-disclaimer')">Disclaimer</span>
        <span class="nav-link" id="user-nav" onclick="handleUserNav()">Login/Profil</span>
    </div>

    <div id="multiplier-bar">
        <img src="https://nasukafoods.site/image/1x.png" class="mult" id="m1">
        <img src="https://nasukafoods.site/image/2x.png" class="mult" id="m2">
        <img src="https://nasukafoods.site/image/3x.png" class="mult" id="m3">
        <img src="https://nasukafoods.site/image/5x.png" class="mult" id="m5">
    </div>

    <div id="win-announcement">
        <h2 style="color: #ffeb3b; font-size: 3.5rem; margin: 0; text-shadow: 0 0 20px #000;">BIG WIN!</h2>
        <div id="win-amount-popup" style="color: #fff; font-size: 2.2rem; font-weight: bold;">0</div>
    </div>

    <div id="grid-container"></div>

    <div id="ui-panel">
        <div class="stats-main">
            <div class="stat-card"><span class="label">GEMS</span><span class="value" id="balance-display">0</span></div>
            <div class="stat-card"><span class="label">BET</span><span class="value" id="bet-display">500</span></div>
        </div>
        <div class="bet-controls">
            <button class="bet-btn" onclick="adjustBet(-1)">-</button>
            <button class="bet-btn" onclick="adjustBet(1)">+</button>
        </div>
        <div class="spin-area">
            <button id="auto-btn" class="auto-btn" onclick="toggleAuto()">AUTO 10</button>
            <button id="spin-btn" onclick="handleSpin()">⚡</button>
        </div>
    </div>

    <div id="page-login" class="spa-page">
        <h3 style="color:var(--gold)">MASUK / DAFTAR</h3>
        <div class="card">
            <input type="number" id="login-wa" placeholder="Nomor WhatsApp">
            <input type="number" id="login-pin" placeholder="PIN 4 Digit">
            <button class="btn-gold" onclick="processAuth()">LANJUTKAN</button>
            <button class="btn-gold" style="background:#444; color:#fff" onclick="closePages()">BATAL</button>
        </div>
    </div>

    <div id="page-profil" class="spa-page">
        <h3 style="color:var(--gold)">PROFIL</h3>
        <div class="card">
            <p>Nama: <span id="prof-nama" style="color:var(--gold)"></span></p>
            <p>WA: <span id="prof-wa"></span></p>
            <p>Gems: <span id="prof-saldo"></span></p>
            <p>Saldo Nasuka: <span id="prof-nasuka" style="color:#4CAF50"></span></p>
        </div>
        <button class="btn-gold" onclick="showPage('page-produk')">BELI GEMS</button>
        <button class="btn-gold" style="background:#cc0000; color:#fff" onclick="logout()">LOGOUT</button>
        <button class="btn-gold" style="background:#444; color:#fff" onclick="closePages()">TUTUP</button>
    </div>

    <div id="page-produk" class="spa-page">
        <h3 style="color:var(--gold)">BELI GEMS</h3>
        <div class="card">
            <p>Saldo Nasuka: <b id="buy-nasuka-val"></b></p>
            <button class="btn-gold" onclick="convertBalance(5000, 500000)">500rb Gems (Rp5.000)</button>
            <button class="btn-gold" onclick="convertBalance(20000, 3000000)">3jt Gems (Rp20.000)</button>
        </div>
        <button class="btn-gold" style="background:#444; color:#fff" onclick="showPage('page-profil')">KEMBALI</button>
    </div>

    <div id="page-disclaimer" class="spa-page">
        <h3>PERINGATAN</h3>
        <div class="card"><p>Aplikasi ini bersifat hiburan semata.</p></div>
        <button class="btn-gold" onclick="closePages()">SAYA MENGERTI</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAJPoqA190LutHQ7xnvnV96GTRHzz24IpT",
        authDomain: "nasukafoods1.firebaseapp.app",
        databaseURL: "https://nasukafoods1-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "nasukafoods1",
        appId: "1:84287800896:web:83189d6766997b00f701a5"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const baseURL = "https://nasukafoods.site/image/";
    const symbolImages = ['m1.jpg', 'm2.jpg', 'm3.jpg', 'maha.jpg'];
    const betLevels = [100, 200, 500, 1000, 2000, 5000, 10000, 50000];

    let currentBetIndex = 2;
    let currentUser = localStorage.getItem("ID");
    let balanceGems = 0;
    let saldoNasuka = 0;
    let isSpinning = false;
    let autoSpinsRemaining = 0;
    let firebaseListener = null;

    function showPage(id) {
        document.querySelectorAll('.spa-page').forEach(p => p.style.display = 'none');
        document.getElementById(id).style.display = 'flex';
        if(currentUser && (id === 'page-profil' || id === 'page-produk')) {
            updateProfileUI();
        }
    }

    function updateProfileUI() {
        if(document.getElementById('prof-wa')) document.getElementById('prof-wa').innerText = currentUser;
        if(document.getElementById('prof-saldo')) document.getElementById('prof-saldo').innerText = balanceGems.toLocaleString();
        if(document.getElementById('prof-nasuka')) document.getElementById('prof-nasuka').innerText = "Rp" + saldoNasuka.toLocaleString();
        if(document.getElementById('buy-nasuka-val')) document.getElementById('buy-nasuka-val').innerText = "Rp" + saldoNasuka.toLocaleString();
    }

    function closePages() { document.querySelectorAll('.spa-page').forEach(p => p.style.display = 'none'); }
    function handleUserNav() { currentUser ? showPage('page-profil') : showPage('page-login'); }

    async function processAuth() {
        const wa = document.getElementById('login-wa').value;
        const pin = document.getElementById('login-pin').value;
        if (wa.length < 10 || pin.length !== 4) return nasukaAlert("WA minimal 10 digit & PIN harus 4 digit!");

        try {
            const snap = await db.ref(`users/${wa}`).once('value');
            if (snap.exists()) {
                const data = snap.val();
                if (String(data.PIN) === String(pin)) {
                    loginUser(wa);
                    nasukaAlert("Login Berhasil!");
                } else {
                    nasukaAlert("PIN SALAH!");
                }
            } else {
                const newUser = {
                    Nama: "User_" + wa.slice(-4),
                    PIN: pin,
                    Saldo: 0,
                    balance: 50000
                };
                await db.ref(`users/${wa}`).set(newUser);
                loginUser(wa);
                nasukaAlert("Akun Baru Berhasil Dibuat!");
            }
        } catch(e) { nasukaAlert("Koneksi Gagal!"); }
    }

    function loginUser(id) {
        localStorage.setItem("ID", id);
        currentUser = id;
        initUserSync();
        closePages();
    }

    function initUserSync() {
        if (!currentUser) return;
        if (firebaseListener) db.ref(`users/${currentUser}`).off('value', firebaseListener);

        firebaseListener = db.ref(`users/${currentUser}`).on('value', (snap) => {
            if (snap.exists()) {
                const data = snap.val();
                balanceGems = data.balance || 0;
                saldoNasuka = data.Saldo || 0;
                document.getElementById('user-nav').innerText = data.Nama || currentUser;
                document.getElementById('balance-display').innerText = balanceGems.toLocaleString();
                if(document.getElementById('prof-nama')) document.getElementById('prof-nama').innerText = data.Nama || "User";
                updateProfileUI();
            }
        });
    }

    function logout() {
        if (firebaseListener) db.ref(`users/${currentUser}`).off('value', firebaseListener);
        localStorage.removeItem("ID");
        currentUser = null;
        balanceGems = 0;
        saldoNasuka = 0;
        document.getElementById('user-nav').innerText = "Login/Profil";
        document.getElementById('balance-display').innerText = "0";
        closePages();
        nasukaAlert("Berhasil Keluar");
    }

    function adjustBet(dir) {
        currentBetIndex = Math.max(0, Math.min(betLevels.length - 1, currentBetIndex + dir));
        document.getElementById('bet-display').innerText = betLevels[currentBetIndex].toLocaleString();
    }

    async function convertBalance(cost, gems) {
        if (saldoNasuka < cost) return nasukaAlert("Saldo Nasuka tidak cukup!");
        await db.ref(`users/${currentUser}`).transaction((curr) => {
            if (curr && curr.Saldo >= cost) {
                curr.Saldo -= cost;
                curr.balance = (curr.balance || 0) + gems;
            }
            return curr;
        });
        nasukaAlert("Pembelian Berhasil!");
    }

    function initGrid() {
        const container = document.getElementById('grid-container');
        container.innerHTML = '';
        for (let i = 0; i < 25; i++) {
            const el = document.createElement('div');
            el.className = 'tile';
            el.innerHTML = `<img src="${baseURL}${symbolImages[Math.floor(Math.random() * 4)]}">`;
            container.appendChild(el);
        }
    }

    async function handleSpin() {
        if (isSpinning) return;
        if (!currentUser) return showPage('page-login');
        const bet = betLevels[currentBetIndex];
        if (balanceGems < bet) { 
            nasukaAlert("Gems tidak cukup!"); 
            autoSpinsRemaining = 0; 
            document.getElementById('auto-btn').classList.remove('active');
            return; 
        }

        isSpinning = true;
        document.getElementById('spin-btn').disabled = true;
        balanceGems -= bet;
        db.ref(`users/${currentUser}`).update({ balance: balanceGems });

        let timer = 0;
        const roll = setInterval(() => {
            initGrid();
            if (timer++ > 10) {
                clearInterval(roll);
                isSpinning = false;
                document.getElementById('spin-btn').disabled = false;
                checkWin(bet);
            }
        }, 80);
    }

    function checkWin(bet) {
        if (Math.random() > 0.8) {
            const win = bet * 5;
            balanceGems += win;
            db.ref(`users/${currentUser}`).update({ balance: balanceGems });
            document.getElementById('win-amount-popup').innerText = win.toLocaleString();
            document.getElementById('win-announcement').classList.add('show-win');
            setTimeout(() => document.getElementById('win-announcement').classList.remove('show-win'), 2000);
        }

        if (autoSpinsRemaining > 0) {
            autoSpinsRemaining--;
            if (autoSpinsRemaining === 0) document.getElementById('auto-btn').classList.remove('active');
            setTimeout(handleSpin, 1500);
        }
    }

    function toggleAuto() {
        if(autoSpinsRemaining > 0) {
            autoSpinsRemaining = 0;
            document.getElementById('auto-btn').classList.remove('active');
        } else {
            autoSpinsRemaining = 10;
            document.getElementById('auto-btn').classList.add('active');
            handleSpin();
        }
    }

    function nasukaAlert(msg) {
        document.getElementById('modal-msg').innerText = msg;
        const btns = document.getElementById('modal-btns');
        btns.innerHTML = `<button class="btn-gold" style="width:100px" onclick="document.getElementById('nasuka-modal-overlay').style.display='none'">OK</button>`;
        document.getElementById('nasuka-modal-overlay').style.display = 'flex';
    }

    initGrid();
    initUserSync();
</script>
</body>
</html>

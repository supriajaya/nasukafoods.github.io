<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nasuka - Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        :root { 
            --primary: #00529C; 
            --secondary: #f37021; 
            --bg-body: #f4f7fa; 
            --text-main: #2c3e50; 
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
            --danger: #ef4444;
            --success: #10b981;
            --gold: #FFD700;
            --gold-bright: #FFF700;
            --tile-white: #fff;
            --tile-shadow: #ddd;
            --retro-border: 3px solid #2c3e50;
            --retro-shadow: 4px 4px 0px #2c3e50;
            --retro-shadow-active: 1px 1px 0px #2c3e50;
        }

        body { 
            background-color: var(--bg-body); 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* --- GAME VIEW CSS (SLOT) --- */
        #slot-page {
            width: 100%;
            min-height: 100vh;
            background-image: url('https://nasukafoods.site/image/qris.jpg'); 
            background-size: cover;
            background-position: center;
            display: none;
            flex-direction: column;
            position: relative;
        }

        #multiplier-bar {
            display: flex;
            justify-content: space-around; 
            align-items: center;
            padding: 10px;
            height: 60px; 
            margin-bottom: -20px;
        }

        .mult {
            width: 50px;
            opacity: 0.3;
            filter: grayscale(100%);
            transition: 0.3s;
        }

        .mult.active {
            opacity: 1;
            filter: grayscale(0%) drop-shadow(0 0 10px var(--gold));
            transform: scale(1.3);
        }

        #grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            padding: 12px;
            margin: 10px auto;
            width: 90%;
            aspect-ratio: 1 / 1;
            background-image: url('https://nasukafoods.site/image/ombak.gif');
            background-size: cover;
            border: 4px solid #444;
            border-radius: 10px;
        }

        .tile {
            background: white;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -3px 0 #ccc;
        }

        .tile img { width: 85%; height: 85%; object-fit: contain; }

        .exploded { animation: win-glow 0.5s infinite alternate; border: 2px solid white; }

        @keyframes win-glow { from { filter: brightness(1); } to { filter: brightness(1.5); } }

        #win-announcement {
            position: absolute; 
            top: 40%; left: 50%; 
            transform: translate(-50%, -50%) scale(0); 
            z-index: 2000; 
            text-align: center; 
            pointer-events: none;
            transition: 0.3s;
        }

        #win-announcement.show-win { transform: translate(-50%, -50%) scale(1); opacity: 1; }

        #ui-panel-slot {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            color: white;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

        /* --- ANGKOT PAGE CSS --- */
        #angkot-page {
            display: none;
            position: fixed;
            inset: 0;
            background: #222;
            z-index: 5000;
        }

        #ui-container-angkot {
            position: absolute;
            top: 60px;
            left: 20px;
            z-index: 10;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        #coin-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #f1c40f;
            display: block;
            margin-bottom: 5px;
        }

        #road-count {
            font-size: 0.9em; 
            color: #ecf0f1;
            margin-top: 5px;
            font-weight: 600;
            background: rgba(0,0,0,0.3);
            padding: 5px 10px;
            border-radius: 5px;
        }

        #controls-angkot {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
        }

        #controls-angkot div {
            display: grid;
            grid-template-columns: 60px 60px 60px;
            gap: 15px;
        }

        #controls-angkot button {
            width: 60px;
            height: 60px;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0px 4px 0px #999;
            cursor: pointer;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }

        #controls-angkot button:active {
            box-shadow: 0px 1px 0px #999;
            transform: translateY(3px);
        }

        #result-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            background: rgba(0,0,0,0.8);
            z-index: 20;
        }

        #result {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            min-width: 280px;
        }

        .btn-group {
            display: flex; gap: 10px; margin-top: 20px;
        }

        .game-btn {
            padding: 15px 30px;
            font-family: inherit;
            font-size: 1em;
            font-weight: bold;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }

        #retry { background-color: #ff4757; color: white; }

        canvas.game {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* --- GLOBAL UI COMPONENTS --- */
        #nasuka-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 20000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #nasuka-modal-overlay.active { display: flex; }
        .nasuka-modal-card {
            background: white;
            width: 100%;
            max-width: 350px;
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
        }

        .modal-icon-box { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; }
        .modal-icon-success { background: #ecfdf5; color: var(--success); }
        .modal-icon-error { background: #fef2f2; color: var(--danger); }

        .modal-btn { width: 100%; padding: 14px; border-radius: 8px; border: var(--retro-border); font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .btn-confirm { background: #FFD93D; box-shadow: var(--retro-shadow); }

        .hero-section { background: var(--primary); padding: 30px 20px 60px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px; background: white; margin: -35px 15px 20px; border-radius: 20px; box-shadow: var(--shadow); position: relative; z-index: 10; }
        .menu-item { text-align: center; cursor: pointer; font-size: 12px; font-weight: bold; }
        .menu-icon { width: 48px; height: 48px; background: #f0f7ff; border-radius: 14px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; overflow: hidden; }
        .menu-icon img { width: 100%; height: 100%; object-fit: cover; }

        .balance-card { background: linear-gradient(135deg, #00529C 0%, #0076de 100%); padding: 25px 20px; border-radius: 20px; color: white; margin-bottom: 20px; text-align: center; }
        .voucher-card { background: white; border-radius: 18px; margin-bottom: 15px; box-shadow: var(--shadow); display: flex; align-items: center; padding: 12px; }
        .voucher-img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; margin-right: 15px; }

        .btn-beli { background: #6BCB77; color: #2c3e50; border: var(--retro-border); padding: 10px 18px; border-radius: 8px; font-weight: 900; cursor: pointer; box-shadow: var(--retro-shadow); transition: 0.1s; }
        .btn-beli:active { transform: translate(2px, 2px); box-shadow: var(--retro-shadow-active); }

        .page-content { display: none; padding-bottom: 30px; animation: slideUp 0.3s ease; }
        .active { display: block !important; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        #login-page { position: fixed; inset: 0; background: white; z-index: 10000; padding: 40px 25px; display: none; text-align: center; }
        .auth-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 12px; box-sizing: border-box; }
        
        .stat-card-slot { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; flex: 1; text-align: center; }
        .spin-btn-slot { width: 70px; height: 70px; background: radial-gradient(circle, #4caf50, #1b5e20); border: 4px solid #fff; border-radius: 50%; font-size: 1.5rem; color: white; cursor: pointer; }
    </style>
</head>

<script type="module">
import * as THREE from 'three';

const firebaseConfig = {
    apiKey: "AIzaSyAJPoqA190LutHQ7xnvnV96GTRHzz24IpT",
    authDomain: "nasukafood1.firebaseapp.com",
    databaseURL: "https://nasukafoods1-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nasukafoods1",
    messagingSenderId: "84287800896",
    appId: "1:84287800896:web:83189d6766997b00f701a5"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();
window.db = db;

let userID = localStorage.getItem("ID");
let userSaldo = 0;
let userGems = 0;
let userRef = null;

// --- ANGKOT GAME LOGIC ---
const minTileIndex = -7; 
const maxTileIndex = 7;  
const tileSize = 42;
const zoomLevel = 3.05; 

let roadsPassed = 0;
let lastRoadIndex = -1;
let isGameOver = false;
let gameInitialized = false;

const scene = new THREE.Scene();
const map = new THREE.Group();
scene.add(map);

const textureLoader = new THREE.TextureLoader();
const playerTex = textureLoader.load('https://nasukafoods.site/image/orangnyebrang.jpg');
const carRightTex = textureLoader.load('https://nasukafoods.site/image/angkotkanan.jpg');
const carLeftTex = textureLoader.load('https://nasukafoods.site/image/angkotkiri.jpg');

const player = new THREE.Group();
const playerSpriteMaterial = new THREE.SpriteMaterial({ map: playerTex });
const playerBody = new THREE.Sprite(playerSpriteMaterial);
playerBody.scale.set(32, 32, 1);
playerBody.position.z = 16; 
player.add(playerBody);
scene.add(player);

let position = { currentRow: 0, currentTile: 0 };
const movesQueue = [];
const clock = new THREE.Clock();
const moveClock = new THREE.Clock(false);
const metadata = [];

function Car(initialTileIndex, direction) {
  const car = new THREE.Group();
  car.position.x = initialTileIndex * tileSize;
  const selectedTex = direction ? carRightTex : carLeftTex;
  const carMaterial = new THREE.SpriteMaterial({ map: selectedTex, transparent: true });
  const carSprite = new THREE.Sprite(carMaterial);
  carSprite.scale.set(70, 45, 1);
  carSprite.position.z = 18; 
  car.add(carSprite);
  return car;
}

function Grass(rowIndex) {
  const grass = new THREE.Group();
  grass.position.y = rowIndex * tileSize;
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(tileSize * 30, tileSize, 3),
    new THREE.MeshLambertMaterial({ color: 0xbaf455 })
  );
  grass.add(mesh);
  return grass;
}

function Road(rowIndex) {
  const road = new THREE.Group();
  road.position.y = rowIndex * tileSize;
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(tileSize * 30, tileSize),
    new THREE.MeshLambertMaterial({ color: 0x454a59 })
  );
  road.add(mesh);
  return road;
}

function updateUI() {
    const coinDisp = document.getElementById("coin-display");
    const roadCount = document.getElementById("road-count");
    if(coinDisp) coinDisp.innerText = `GEMS: ${userGems.toLocaleString()}`;
    if(roadCount) roadCount.innerText = `JALAN DILEWATI: ${roadsPassed}`;
}

window.initializeMap = () => {
    metadata.length = 0;
    while(map.children.length > 0) map.remove(map.children[0]);
    for (let i = -10; i <= 0; i++) map.add(Grass(i));
    
    position.currentRow = 0;
    position.currentTile = 0;
    player.position.set(0,0,0);
    roadsPassed = 0;
    lastRoadIndex = -1;
    isGameOver = false;
    movesQueue.length = 0;

    addRows();
    updateUI();
};

function addRows() {
    for (let i = 0; i < 20; i++) {
        const type = Math.random() > 0.4 ? "car" : "forest";
        const rowIndex = metadata.length + 1;
        let row;
        const rowData = { type, vehicles: [] };

        if (type === "forest") {
            row = Grass(rowIndex);
        } else {
            row = Road(rowIndex);
            rowData.direction = Math.random() > 0.5;
            rowData.speed = 120 + Math.random() * 120;
            for (let v = 0; v < 2; v++) {
                const initialTileIndex = Math.floor(Math.random() * (maxTileIndex - minTileIndex)) + minTileIndex;
                const vehicle = Car(initialTileIndex, rowData.direction);
                row.add(vehicle);
                rowData.vehicles.push({ ref: vehicle });
            }
        }
        map.add(row);
        metadata.push(rowData);
    }
}

function queueMove(direction) {
    if (isGameOver) return;
    if (direction === "left") playerBody.scale.x = -32;
    if (direction === "right") playerBody.scale.x = 32;
    if (direction === "forward") movesQueue.push(direction);
    if (direction === "backward" && position.currentRow > 0) movesQueue.push(direction);
    if (direction === "left" && position.currentTile > minTileIndex) movesQueue.push(direction);
    if (direction === "right" && position.currentTile < maxTileIndex) movesQueue.push(direction);
}

function stepCompleted() {
    const dir = movesQueue.shift();
    const prevRow = position.currentRow;

    if (dir === "forward") position.currentRow++;
    if (dir === "backward") position.currentRow--;
    if (dir === "left") position.currentTile--;
    if (dir === "right") position.currentTile++;
    
    const prevRowData = metadata[prevRow - 1]; 
    if (prevRowData && prevRowData.type === "car" && prevRow > lastRoadIndex) {
        roadsPassed++;
        lastRoadIndex = prevRow;
        giveGemsReward(10); 
        updateUI();
    }

    if (position.currentRow > metadata.length - 15) addRows();
}

async function giveGemsReward(amount) {
    if(!userID) return;
    userGems += amount;
    await window.db.ref(`users/${userID}/Gems`).set(userGems);
}

function showResult(message, type) {
    isGameOver = true;
    const container = document.getElementById("result-container");
    const statusText = document.getElementById("result-status");
    const descText = document.getElementById("result-desc");

    statusText.innerText = message;
    container.style.visibility = "visible";
    statusText.style.color = "#ff4757";
    descText.innerText = `Skor akhir: ${roadsPassed} jalan.`;
}

const camera = new THREE.OrthographicCamera(
    window.innerWidth / -zoomLevel, window.innerWidth / zoomLevel, 
    window.innerHeight / zoomLevel, window.innerHeight / -zoomLevel, 
    1, 1000
);
camera.position.set(0, -200, 200); 
camera.lookAt(0, 0, 0);

const canvasAngkot = document.getElementById("angkotCanvas");
const renderer = new THREE.WebGLRenderer({ canvas: canvasAngkot, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
scene.add(new THREE.AmbientLight(0xffffff, 0.9));

function animate() {
    requestAnimationFrame(animate);
    if (isGameOver || !gameInitialized) {
        if(gameInitialized) renderer.render(scene, camera);
        return;
    }
    
    const delta = clock.getDelta();
    metadata.forEach(row => {
        if (row.type === "car") {
            row.vehicles.forEach(v => {
                if (row.direction) {
                    v.ref.position.x += row.speed * delta;
                    if (v.ref.position.x > 400) v.ref.position.x = -400;
                } else {
                    v.ref.position.x -= row.speed * delta;
                    if (v.ref.position.x < -400) v.ref.position.x = 400;
                }
            });
        }
    });

    if (movesQueue.length > 0) {
        if (!moveClock.running) moveClock.start();
        const progress = Math.min(1, moveClock.getElapsedTime() / 0.15);
        const startX = position.currentTile * tileSize;
        const startY = position.currentRow * tileSize;
        let endX = startX, endY = startY;

        if (movesQueue[0] === "forward") endY += tileSize;
        if (movesQueue[0] === "backward") endY -= tileSize;
        if (movesQueue[0] === "left") endX -= tileSize;
        if (movesQueue[0] === "right") endX += tileSize;

        player.position.x = THREE.MathUtils.lerp(startX, endX, progress);
        player.position.y = THREE.MathUtils.lerp(startY, endY, progress);
        playerBody.position.z = 16 + Math.sin(progress * Math.PI) * 20;

        if (progress >= 1) {
            stepCompleted();
            moveClock.stop();
        }
    }

    camera.position.y = player.position.y - 200;
    camera.lookAt(0, player.position.y, 0);

    const curRow = metadata[position.currentRow - 1];
    if (curRow && curRow.type === "car") {
        curRow.vehicles.forEach(v => {
            if (Math.abs(v.ref.position.x - player.position.x) < 35) {
                showResult("Hati hati nyebrang jalan ya!", "lose");
            }
        });
    }
    renderer.render(scene, camera);
}

// --- CORE UI FUNCTIONS ---
window.hideAll = () => {
    document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
    document.getElementById('slot-page').style.display = 'none';
    document.getElementById('angkot-page').style.display = 'none';
    document.getElementById('login-page').style.display = 'none';
};

window.showHome = () => { 
    hideAll(); 
    document.getElementById('home-page').classList.add('active'); 
    renderProducts(); 
};

window.showProfile = () => { if(!checkLogin()) return; hideAll(); document.getElementById('profile-page').classList.add('active'); };
window.showHistory = () => { if(!checkLogin()) return; hideAll(); document.getElementById('history-page').classList.add('active'); };

window.showSlot = () => {
    if(!checkLogin()) return;
    hideAll();
    document.getElementById('slot-page').style.display = 'flex';
    initSlotGrid();
};

window.showAngkotage = () => {
    if(!checkLogin()) return;
    hideAll();
    document.getElementById('angkot-page').style.display = 'block';
    gameInitialized = true;
    window.initializeMap();
};

window.closeAngkot = () => {
    gameInitialized = false;
    showHome();
};

window.checkLogin = () => {
    if(!userID) { 
        hideAll(); 
        document.getElementById('login-page').style.display = 'block'; 
        return false; 
    }
    return true;
};

// --- AUTH & DATA ---
window.initApp = () => {
    renderProducts();
    if(userID) {
        if(userRef) userRef.off();
        userRef = window.db.ref(`users/${userID}`);
        userRef.on('value', snap => {
            const data = snap.val();
            if(data) {
                userSaldo = data.Saldo || 0;
                userGems = data.Gems || 0;
                document.getElementById('header-user-name').innerText = data.Nama || "User";
                document.getElementById('displaySaldo').innerText = "Rp " + userSaldo.toLocaleString();
                document.getElementById('displayGems').innerText = "💎 " + userGems.toLocaleString();
                document.getElementById('profile-name-view').innerText = data.Nama;
                updateSlotUI();
                updateUI();
            }
        });
    } else {
        document.getElementById('header-user-name').innerText = "Tamu";
    }
};

window.handleAuth = () => {
    const wa = document.getElementById('auth-wa').value;
    const pin = document.getElementById('auth-pin').value;
    if(wa.length < 10) return alert("Nomor WA tidak valid");
    window.db.ref(`users/${wa}`).once('value', snap => {
        if(snap.exists() && snap.val().PIN !== pin) return alert("PIN Salah");
        if(!snap.exists()) {
            window.db.ref(`users/${wa}`).set({ Nama: "Kawan", PIN: pin, Saldo: 0, Gems: 25000 });
        }
        localStorage.setItem("ID", wa);
        userID = wa;
        initApp();
        showHome();
    });
};

window.logout = () => { 
    localStorage.removeItem("ID"); 
    userID = null;
    if(userRef) userRef.off();
    userSaldo = 0;
    userGems = 0;
    document.getElementById('header-user-name').innerText = "Tamu";
    document.getElementById('displaySaldo').innerText = "Rp 0";
    document.getElementById('displayGems').innerText = "💎 0";
    hideAll();
    document.getElementById('login-page').style.display = 'block';
};

// --- SLOT SYSTEM ---
const symbolImages = ['m1.jpg', 'm2.jpg', 'm3.jpg', 'maha.jpg'];
const betLevels = [100, 200, 500, 1000, 2000, 5000];
let currentBetIdx = 2;
let isSpinningSlot = false;
let gridTiles = [];

window.initSlotGrid = () => {
    const container = document.getElementById('grid-container');
    container.innerHTML = ''; gridTiles = [];
    for(let i=0; i<25; i++) {
        const div = document.createElement('div'); div.className = 'tile';
        const img = symbolImages[Math.floor(Math.random()*4)];
        div.innerHTML = `<img src="https://nasukafoods.site/image/${img}">`;
        container.appendChild(div);
        gridTiles.push({ el: div, symbol: img });
    }
};

window.updateSlotUI = () => {
    const gemEl = document.getElementById('slot-gems');
    const betEl = document.getElementById('slot-bet');
    if(gemEl) gemEl.innerText = "💎 " + (userGems || 0).toLocaleString();
    if(betEl) betEl.innerText = "💎 " + betLevels[currentBetIdx].toLocaleString();
};

window.adjustBetSlot = (dir) => {
    if(isSpinningSlot) return;
    currentBetIdx = Math.max(0, Math.min(betLevels.length-1, currentBetIdx + dir));
    updateSlotUI();
};

window.handleSpinSlot = async () => {
    if(isSpinningSlot) return;
    const bet = betLevels[currentBetIdx];
    if(userGems < bet) return showNasukaModal('error', 'Gems Habis', 'Saldo Gems tidak cukup.');

    isSpinningSlot = true;
    userGems -= bet;
    window.db.ref(`users/${userID}/Gems`).set(userGems);
    
    const roll = setInterval(() => {
        gridTiles.forEach(t => {
            const sym = symbolImages[Math.floor(Math.random()*4)];
            t.el.innerHTML = `<img src="https://nasukafoods.site/image/${sym}">`;
        });
    }, 100);

    setTimeout(() => {
        clearInterval(roll);
        finishSpin(bet);
    }, 1200);
};

function finishSpin(bet) {
    let win = Math.random() > 0.7;
    if(win) {
        let mult = [2, 3, 5][Math.floor(Math.random()*3)];
        let winAmt = bet * mult;
        userGems += winAmt;
        window.db.ref(`users/${userID}/Gems`).set(userGems);
        document.getElementById('win-amount-popup').innerText = "💎 " + winAmt.toLocaleString();
        document.getElementById('win-announcement').classList.add('show-win');
        setTimeout(() => document.getElementById('win-announcement').classList.remove('show-win'), 2000);
    }
    isSpinningSlot = false;
    updateSlotUI();
}

// --- UTILS ---
window.showNasukaModal = (type, title, msg) => {
    const overlay = document.getElementById('nasuka-modal-overlay');
    document.getElementById('modal-icon').className = `modal-icon-box modal-icon-${type === 'error' ? 'error' : 'success'}`;
    document.getElementById('modal-icon').innerHTML = type === 'error' ? '×' : '✓';
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-msg').innerText = msg;
    overlay.classList.add('active');
    document.getElementById('modal-btn-main').onclick = () => overlay.classList.remove('active');
};

const products = [
    { id: "ax1", name: "Axis 5GB 1hr", price: 7000, img: "https://nasukafoods.site/image/axis.jpg" },
    { id: "xl1", name: "XL 10GB", price: 12000, img: "https://nasukafoods.site/image/xl.jpg" }
];

window.renderProducts = () => {
    const list = document.getElementById('voucher-list');
    if(!list) return;
    list.innerHTML = products.map(p => `
        <div class="voucher-card">
            <img src="${p.img}" class="voucher-img">
            <div style="flex:1"><b>${p.name}</b><br><span style="color:orange">Rp ${p.price.toLocaleString()}</span></div>
            <button onclick="prosesBeli('${p.id}', '${p.name}', ${p.price})" class="btn-beli">BELI</button>
        </div>
    `).join('');
};

window.prosesBeli = async (id, nama, harga) => {
    if(!checkLogin()) return;
    if(userSaldo < harga) return showNasukaModal('error', 'Saldo Kurang', 'Silakan Topup Saldo Rp.');
    if(confirm(`Beli ${nama}?`)) {
        userSaldo -= harga;
        await window.db.ref(`users/${userID}/Saldo`).set(userSaldo);
        showNasukaModal('success', 'Berhasil', 'Pembelian sukses!');
    }
};

window.tukarGems = async () => {
    if(!checkLogin()) return;
    const hargaGems = 500;
    const dapatGems = 25000;
    if(userSaldo < hargaGems) return alert("Saldo Rupiah tidak cukup!");
    if(confirm(`Beli 25.000 Gems seharga Rp 500?`)) {
        userSaldo -= hargaGems;
        userGems += dapatGems;
        await window.db.ref(`users/${userID}`).update({ Saldo: userSaldo, Gems: userGems });
        alert("Berhasil membeli Gems!");
    }
}

window.showInformasi = () => showNasukaModal('info', 'Info Admin', 'WhatsApp: 0859109819017');

document.getElementById("forward").onclick = () => queueMove("forward");
document.getElementById("backward").onclick = () => queueMove("backward");
document.getElementById("left").onclick = () => queueMove("left");
document.getElementById("right").onclick = () => queueMove("right");
document.getElementById("retry").onclick = () => { 
    document.getElementById("result-container").style.visibility = "hidden"; 
    window.initializeMap(); 
};

window.addEventListener("resize", () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.left = window.innerWidth / -zoomLevel;
    camera.right = window.innerWidth / zoomLevel;
    camera.top = window.innerHeight / zoomLevel;
    camera.bottom = window.innerHeight / -zoomLevel;
    camera.updateProjectionMatrix();
});

window.addEventListener('load', () => {
    window.initApp();
    animate();
});
</script>
